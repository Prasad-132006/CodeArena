services:
  postgres:
    image: postgres:16-alpine
    container_name: codearena_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codearena_secret}
      POSTGRES_DB: ${POSTGRES_DB:-codearena_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codearena} -d ${POSTGRES_DB:-codearena_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codearena_net

  redis:
    image: redis:7-alpine
    container_name: codearena_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codearena_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codearena_backend
    restart: unless-stopped
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-codearena}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-codearena_secret}
      - POSTGRES_DB=${POSTGRES_DB:-codearena_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codearena_net

  judge-runner-image:
    image: codearena-cpp-runner:1.0
    build:
      context: ./judge
      dockerfile: Dockerfile.runner
    command: ["true"]
    restart: "no"

  judge-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: codearena_judge_worker
    restart: unless-stopped
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-codearena}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-codearena_secret}
      - POSTGRES_DB=${POSTGRES_DB:-codearena_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JUDGE_IMAGE=codearena-cpp-runner:1.0
      - JUDGE_WORKSPACE_ROOT=/judge-workspaces
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - judge_workspaces:/judge-workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge-runner-image:
        condition: service_completed_successfully
    networks:
      - codearena_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codearena_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - codearena_net

networks:
  codearena_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  judge_workspaces:
    name: codearena_judge_workspaces
